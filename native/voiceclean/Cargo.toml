# WavePod's Voice Clean filter: DeepFilterNet 3 (voice vs. noise) plus a statistical late-reverb
# estimator (dry voice vs. room), compiled to WebAssembly so one build runs on every platform.
# Build with `make voiceclean` (needs Rust and the wasm32-unknown-unknown target).
[package]
name = "wavepod-voiceclean"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
deep_filter = { path = "deep_filter", default-features = false, features = ["tract", "default-model"] }
ndarray = "^0.15"
# tract pulls in rand; inference never draws random numbers, but wasm32 needs a source anyway
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
