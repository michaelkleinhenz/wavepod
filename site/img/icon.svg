<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>WavePod</title>
  <!-- Source of the app and web icon. Re-render the PNGs with: node scripts/render-icons.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="wave" x1="248" y1="0" x2="776" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="0.35" stop-color="#5c8dff"/>
      <stop offset="0.65" stop-color="#ba68c8"/>
      <stop offset="0.85" stop-color="#f06292"/>
      <stop offset="1" stop-color="#ffb74d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c8dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5c8dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip"><rect x="80" y="80" width="864" height="864" rx="196"/></clipPath>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="512" cy="516" rx="420" ry="300" fill="url(#glow)"/>
  </g>
  <rect x="81.5" y="81.5" width="861" height="861" rx="194.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- The pod: a capsule holding a waveform, with a record light on its rim. -->
  <rect x="176" y="332" width="672" height="400" rx="200" fill="#0b0d14" fill-opacity="0.6" stroke="url(#wave)" stroke-width="36"/>
  <g fill="url(#wave)">
    <rect x="284" y="484" width="64" height="96" rx="32"/>
    <rect x="382" y="424" width="64" height="216" rx="32"/>
    <rect x="480" y="382" width="64" height="300" rx="32"/>
    <rect x="578" y="432" width="64" height="200" rx="32"/>
    <rect x="676" y="490" width="64" height="84" rx="32"/>
  </g>
  <circle cx="782" cy="383" r="86" fill="#141722"/>
  <circle cx="782" cy="383" r="62" fill="#e53935"/>
</svg>
