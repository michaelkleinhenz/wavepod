name: Release

# The only workflow that runs on Windows and macOS: tests and packages every platform when a
# release tag (v*) is pushed. Pull requests are checked on Linux only (ci.yml).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux AppImage and .deb
            target: dist-linux
            # the .deb installs an AppArmor profile, which Ubuntu 24.04+ needs for Chromium's sandbox
            files: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            name: Windows installer
            target: dist-win
            files: release/*.exe
          - os: macos-latest
            name: macOS DMG
            target: dist-mac
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci compiles the patched audify, which needs the ALSA/PulseAudio headers on Linux.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: npm ci
      - name: Set version from tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm test
      - name: Package
        run: make ${{ matrix.target }}
        env:
          NODE_ENV: production
          # Unsigned builds unless signing secrets are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
