name: Release

# The only workflow that runs on Windows and macOS: tests and packages every platform when a
# release tag (v*) is pushed. Pull requests are checked on Linux only (ci.yml).
#
# Microsoft Store: once the Store repository variables and secrets are set (README › Releases ›
# Microsoft Store), the Windows job also packages an MSIX and the store job submits it to Partner
# Center, where Microsoft certifies and signs it. Without them both steps are skipped. Pre-release
# tags (v1.2.0-beta.1) never go to the Store.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux AppImage and .deb
            target: dist-linux
            # the .deb installs an AppArmor profile, which Ubuntu 24.04+ needs for Chromium's sandbox
            files: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            name: Windows installer
            target: dist-win
            files: release/*.exe
          - os: macos-latest
            name: macOS DMG
            target: dist-mac
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci compiles the patched audify, which needs the ALSA/PulseAudio headers on Linux.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: npm ci
      - name: Set version from tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm test
      - name: Package
        run: make ${{ matrix.target }}
        env:
          NODE_ENV: production
          # Unsigned builds unless signing secrets are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # A Store packaging problem must not hold up the GitHub release; the store job then fails instead.
      - name: Package for the Microsoft Store
        id: store
        if: matrix.target == 'dist-win' && vars.MSSTORE_IDENTITY_NAME != '' && !contains(github.ref_name, '-')
        continue-on-error: true
        run: make dist-store
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@v4
        if: steps.store.outcome == 'success'
        with:
          name: store-msix
          path: release/*.msix
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the downloads; the Store MSIX is unsigned until Microsoft signs it, so it stays off the release.
          pattern: dist-*
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # Shown above the generated notes, so Windows users see it before downloading.
          body: |
            ## Installing

            Pick the file for your computer under **Assets**; the [install guide](https://github.com/michaelkleinhenz/wavepod#getting-started) has the steps.

            **Windows:** the easiest way is the [Microsoft Store](https://apps.microsoft.com/detail/9NRV8PP5JPCB): signed by Microsoft, no warnings, updates itself (new versions appear there a few days after this release). The installer below isn't code-signed (certificates cost money every year, and WavePod is a free project). If Windows says *"Windows protected your PC"*, click **More info › Run anyway**. If it says *"Smart App Control blocked an app"*, there is no per-app exception: turn Smart App Control off under **Windows Security › App & browser control › Smart App Control settings**, then run the installer again. [Details](https://github.com/michaelkleinhenz/wavepod#windows-smart-app-control-blocks-wavepod)

            **macOS:** open WavePod once, then click **Open Anyway** under **System Settings › Privacy & Security**.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  store:
    name: Submit to the Microsoft Store
    runs-on: ubuntu-latest
    needs: release
    if: vars.MSSTORE_PRODUCT_ID != '' && vars.MSSTORE_IDENTITY_NAME != '' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-msix
          path: store
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Sign in to Partner Center
        run: msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      # Replaces the package on a new submission (listing text and screenshots stay as they are in
      # Partner Center) and submits it for certification. Usually live within a few days.
      - name: Submit the package
        shell: bash
        run: |
          msix=$(ls store/*.msix)
          echo "Submitting $msix"
          msstore publish store --inputFile "$msix" --appId "$PRODUCT_ID"
        env:
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
