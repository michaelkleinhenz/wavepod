name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 libpulse0
      - run: npm ci
      - run: npm run typecheck
      # The VST3 host helper plus the SDK's sample plug-ins, so the host tests run for real.
      - name: Build VST3 host and sample plug-ins
        shell: bash
        run: |
          cmake -S native/vsthost -B native/vsthost/build -DCMAKE_BUILD_TYPE=Release -DWAVEPOD_VST3_SAMPLES=ON
          cmake --build native/vsthost/build --config Release --parallel --target wavepod-vsthost test_plugins
      - run: npm test
      - run: npm run build
      # Runners have no audio devices, so only check that the prebuilt binary loads.
      - name: Check native audio module loads
        run: node -e "const a = require('audify'); if (typeof a.RtAudio !== 'function') process.exit(1); console.log('audify ok')"

  package:
    name: Package smoke test (Linux)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: WavePod-linux-ci
          path: release/*.AppImage
          retention-days: 7
