name: CI

# To save CI minutes this does not run on every merge. All three platforms are checked when a
# release is tagged (alongside release.yml, which builds the installers) and when run by hand from
# the Actions tab (Run workflow); pull requests are checked on Linux only.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm ci compiles the patched audify (scripts/build-audify.mjs), which needs the ALSA/PulseAudio headers.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config pulseaudio xvfb
      - run: npm ci
      - run: npm run typecheck
      # The VST3 host helper plus the SDK's sample plug-ins, so the host tests run for real.
      - name: Build VST3 host and sample plug-ins
        shell: bash
        run: |
          cmake -S native/vsthost -B native/vsthost/build -DCMAKE_BUILD_TYPE=Release -DWAVEPOD_VST3_SAMPLES=ON
          cmake --build native/vsthost/build --config Release --parallel --target wavepod-vsthost test_plugins
      - run: npm test
      - run: npm run build
      # Runners have no audio devices, so only check that the prebuilt binary loads.
      - name: Check native audio module loads
        run: node -e "const a = require('audify'); if (typeof a.RtAudio !== 'function') process.exit(1); console.log('audify ok')"
      # Opens real streams on a PulseAudio null sink inside Electron's main process, where
      # Electron's allocator catches native memory bugs that plain Node does not.
      - name: Audio streams in Electron (Linux)
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci sink_properties=device.description=CI-Stereo
          # 16 channels like a RØDECaster in multitrack mode. Descriptions must differ:
          # RtAudio merges PulseAudio devices with the same description.
          pactl load-module module-null-sink sink_name=ci16 channels=16 rate=48000 sink_properties=device.description=CI-16ch
          xvfb-run -a npx electron --no-sandbox test/electron/audio-smoke.cjs

  package:
    name: Package smoke test (Linux)
    runs-on: ubuntu-latest
    needs: check
    # a tag already packages every platform in release.yml; only a manual run needs this one
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - run: npm ci
      - run: make dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: WavePod-linux-ci
          path: release/*.AppImage
          retention-days: 7
