name: Pages

# Publishes the project web page in site/ to GitHub Pages.
# Needs Settings › Pages › Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/guest/**', 'src/shared/**', 'scripts/build-guest.mjs', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # the guest page for remote recording (site/join/v1/guest.js) is built from src/guest
      - run: npm ci --ignore-scripts
      - run: node scripts/build-guest.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
